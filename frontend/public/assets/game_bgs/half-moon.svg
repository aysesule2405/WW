<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#0F1E3A"/>
      <stop offset="60%"  stop-color="#080F22"/>
      <stop offset="100%" stop-color="#04080F"/>
    </radialGradient>
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF8C0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFF8C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground-glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#1A2E50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#04080F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1800" height="1040" fill="url(#sky)"/>

  <!-- Subtle nebula wisps -->
  <ellipse cx="400"  cy="200" rx="380" ry="120" fill="#1A2A4A" opacity="0.18"/>
  <ellipse cx="1400" cy="280" rx="320" ry="100" fill="#2A1A4A" opacity="0.14"/>
  <ellipse cx="900"  cy="500" rx="500" ry="80"  fill="#0A1A3A" opacity="0.20"/>

  <!-- Stars — small scattered -->
  <g fill="white">
    <circle cx="80"   cy="60"   r="1.2" opacity="0.9"/>
    <circle cx="160"  cy="110"  r="0.8" opacity="0.7"/>
    <circle cx="240"  cy="45"   r="1.5" opacity="0.85"/>
    <circle cx="360"  cy="80"   r="1.0" opacity="0.8"/>
    <circle cx="450"  cy="30"   r="1.3" opacity="0.75"/>
    <circle cx="540"  cy="95"   r="0.9" opacity="0.65"/>
    <circle cx="630"  cy="55"   r="1.1" opacity="0.9"/>
    <circle cx="720"  cy="20"   r="0.8" opacity="0.7"/>
    <circle cx="820"  cy="75"   r="1.4" opacity="0.85"/>
    <circle cx="950"  cy="35"   r="1.0" opacity="0.8"/>
    <circle cx="1060" cy="88"   r="1.2" opacity="0.75"/>
    <circle cx="1160" cy="48"   r="0.9" opacity="0.7"/>
    <circle cx="1250" cy="72"   r="1.5" opacity="0.9"/>
    <circle cx="1360" cy="25"   r="1.1" opacity="0.8"/>
    <circle cx="1450" cy="90"   r="0.8" opacity="0.65"/>
    <circle cx="1560" cy="50"   r="1.3" opacity="0.85"/>
    <circle cx="1660" cy="110"  r="1.0" opacity="0.75"/>
    <circle cx="1740" cy="65"   r="0.9" opacity="0.8"/>
    <circle cx="100"  cy="200"  r="0.9" opacity="0.6"/>
    <circle cx="280"  cy="175"  r="1.2" opacity="0.75"/>
    <circle cx="480"  cy="190"  r="0.8" opacity="0.65"/>
    <circle cx="680"  cy="165"  r="1.1" opacity="0.8"/>
    <circle cx="1100" cy="170"  r="1.0" opacity="0.7"/>
    <circle cx="1300" cy="155"  r="1.3" opacity="0.85"/>
    <circle cx="1500" cy="180"  r="0.9" opacity="0.65"/>
    <circle cx="1700" cy="160"  r="1.1" opacity="0.75"/>
    <circle cx="50"   cy="320"  r="1.0" opacity="0.55"/>
    <circle cx="200"  cy="350"  r="0.8" opacity="0.5"/>
    <circle cx="1600" cy="330"  r="1.2" opacity="0.6"/>
    <circle cx="1750" cy="360"  r="0.9" opacity="0.55"/>
    <circle cx="120"  cy="480"  r="0.8" opacity="0.4"/>
    <circle cx="1680" cy="470"  r="1.0" opacity="0.45"/>
  </g>

  <!-- Brighter accent stars -->
  <g fill="#FFF8C0" filter="url(#star-glow)">
    <circle cx="190"  cy="130"  r="2.0" opacity="0.85"/>
    <circle cx="560"  cy="145"  r="1.8" opacity="0.8"/>
    <circle cx="870"  cy="120"  r="2.2" opacity="0.9"/>
    <circle cx="1180" cy="138"  r="1.9" opacity="0.8"/>
    <circle cx="1490" cy="125"  r="2.1" opacity="0.85"/>
    <circle cx="1730" cy="200"  r="1.8" opacity="0.75"/>
    <circle cx="60"   cy="400"  r="1.6" opacity="0.6"/>
    <circle cx="1760" cy="420"  r="1.7" opacity="0.55"/>
  </g>

  <!-- Moon glow halo -->
  <ellipse cx="900" cy="340" rx="340" ry="340" fill="url(#moon-halo)"/>

  <!-- Moon: full disk -->
  <circle cx="900" cy="340" r="200" fill="#FFF8C0" opacity="0.10"/>
  <circle cx="900" cy="340" r="190" fill="#FFF8C0" opacity="0.86" filter="url(#soft-glow)"/>

  <!-- Half Moon cut (crescent shape) -->
  <circle cx="962" cy="340" r="178" fill="#080F22"/>

  <!-- Moon surface detail — subtle craters -->
  <circle cx="840" cy="295" r="22" fill="#EEE8A8" opacity="0.12"/>
  <circle cx="875" cy="380" r="14" fill="#EEE8A8" opacity="0.10"/>
  <circle cx="810" cy="355" r="10" fill="#EEE8A8" opacity="0.08"/>

  <!-- Moon face -->
  <circle cx="860" cy="318" r="14" fill="#C8A84B" opacity="0.65"/>
  <circle cx="914" cy="318" r="14" fill="#C8A84B" opacity="0.65"/>
  <!-- Smile arc -->
  <path d="M848 355 Q887 378 926 355" stroke="#C8A84B" stroke-width="4" fill="none" opacity="0.65" stroke-linecap="round"/>

  <!-- Moon border ring -->
  <circle cx="900" cy="340" r="191" fill="none" stroke="#C8A84B" stroke-width="2" opacity="0.35"/>

  <!-- Stars close to moon -->
  <g fill="#FFF8C0" filter="url(#star-glow)">
    <circle cx="660"  cy="220" r="3.5" opacity="0.8"/>
    <circle cx="1150" cy="210" r="3.0" opacity="0.75"/>
    <circle cx="640"  cy="450" r="2.8" opacity="0.7"/>
    <circle cx="1170" cy="462" r="3.2" opacity="0.72"/>
    <circle cx="740"  cy="160" r="2.2" opacity="0.65"/>
    <circle cx="1060" cy="155" r="2.5" opacity="0.68"/>
    <circle cx="690"  cy="530" r="2.0" opacity="0.6"/>
    <circle cx="1110" cy="525" r="2.2" opacity="0.62"/>
  </g>

  <!-- Ornate circle rings around moon -->
  <circle cx="900" cy="340" r="230" fill="none" stroke="#C8A84B" stroke-width="0.8" stroke-dasharray="6 12" opacity="0.22"/>
  <circle cx="900" cy="340" r="270" fill="none" stroke="#C8A84B" stroke-width="0.5" stroke-dasharray="3 18" opacity="0.14"/>

  <!-- Ground / horizon glow -->
  <rect x="0" y="800" width="1800" height="240" fill="url(#ground-glow)" opacity="0.6"/>

  <!-- Distant hills silhouette -->
  <path d="M0 920 Q150 830 300 870 Q450 910 600 840 Q750 770 900 810 Q1050 850 1200 790 Q1350 730 1500 780 Q1650 830 1800 850 L1800 1040 L0 1040 Z"
        fill="#0A1422" opacity="0.95"/>

  <!-- Card grid hint at bottom — faint tarot cards -->
  <g opacity="0.12" transform="translate(900, 970)">
    <rect x="-200" y="-44" width="52" height="78" rx="6" fill="none" stroke="#C8A84B" stroke-width="1.5" transform="rotate(-10)"/>
    <rect x="-120" y="-52" width="52" height="78" rx="6" fill="none" stroke="#C8A84B" stroke-width="1.5" transform="rotate(-3)"/>
    <rect x="-38"  y="-50" width="52" height="78" rx="6" fill="none" stroke="#C8A84B" stroke-width="1.5" transform="rotate(3)"/>
    <rect x="44"   y="-46" width="52" height="78" rx="6" fill="none" stroke="#C8A84B" stroke-width="1.5" transform="rotate(9)"/>
    <rect x="126"  y="-40" width="52" height="78" rx="6" fill="none" stroke="#C8A84B" stroke-width="1.5" transform="rotate(15)"/>
  </g>

  <!-- Title text -->
  <text x="900" y="620" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="700" letter-spacing="2"
        fill="#FFF8C0" opacity="0.88" filter="url(#soft-glow)">Rise of the Half Moon</text>

  <text x="900" y="668" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" letter-spacing="4"
        fill="#C8A84B" opacity="0.65">BACKGROUND PLACEHOLDER</text>
</svg>
