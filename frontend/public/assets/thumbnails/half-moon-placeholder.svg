<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F1E3A"/>
      <stop offset="100%" stop-color="#060C1A"/>
    </radialGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8C0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFF8C0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="72"  cy="48"  r="1.2"/><circle cx="140" cy="90"  r="0.9"/>
    <circle cx="210" cy="34"  r="1.4"/><circle cx="305" cy="68"  r="0.8"/>
    <circle cx="380" cy="22"  r="1.1"/><circle cx="470" cy="55"  r="1.3"/>
    <circle cx="560" cy="30"  r="0.9"/><circle cx="650" cy="78"  r="1.5"/>
    <circle cx="720" cy="42"  r="1.0"/><circle cx="88"  cy="140" r="0.8"/>
    <circle cx="180" cy="160" r="1.2"/><circle cx="620" cy="130" r="1.1"/>
    <circle cx="740" cy="150" r="0.9"/><circle cx="50"  cy="280" r="1.0"/>
    <circle cx="760" cy="300" r="1.3"/><circle cx="110" cy="380" r="0.8"/>
    <circle cx="690" cy="400" r="1.1"/><circle cx="340" cy="450" r="0.9"/>
    <circle cx="490" cy="430" r="1.2"/><circle cx="30"  cy="460" r="0.7"/>
  </g>

  <!-- Moon glow halo -->
  <circle cx="400" cy="210" r="130" fill="url(#moon-glow)"/>

  <!-- Full moon circle (background) -->
  <circle cx="400" cy="210" r="88" fill="#FFF8C0" opacity="0.12" filter="url(#glow)"/>

  <!-- Half Moon shape: full circle minus crescent cut -->
  <circle cx="400" cy="210" r="80" fill="#FFF8C0" opacity="0.9"/>
  <circle cx="440" cy="210" r="75" fill="#060C1A"/>

  <!-- Moon face features -->
  <circle cx="378" cy="200" r="7" fill="#C8A84B" opacity="0.7"/>
  <circle cx="410" cy="200" r="7" fill="#C8A84B" opacity="0.7"/>
  <!-- Smile -->
  <path d="M372 220 Q394 234 416 220" stroke="#C8A84B" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Gold border ring -->
  <circle cx="400" cy="210" r="81" fill="none" stroke="#C8A84B" stroke-width="1.5" opacity="0.5"/>

  <!-- Stars around moon -->
  <g fill="#FFF8C0" filter="url(#glow)">
    <circle cx="292" cy="148" r="2.5" opacity="0.8"/>
    <circle cx="510" cy="142" r="2"   opacity="0.7"/>
    <circle cx="300" cy="285" r="2"   opacity="0.6"/>
    <circle cx="505" cy="278" r="2.5" opacity="0.75"/>
    <circle cx="340" cy="112" r="1.5" opacity="0.6"/>
    <circle cx="462" cy="108" r="1.5" opacity="0.6"/>
  </g>

  <!-- Card stack decoration at bottom -->
  <g transform="translate(400,390)">
    <rect x="-90" y="-26" width="60" height="46" rx="6" fill="#0A1628" stroke="#C8A84B" stroke-width="1" stroke-opacity="0.6" transform="rotate(-8)"/>
    <rect x="-50" y="-30" width="60" height="46" rx="6" fill="#0A1628" stroke="#C8A84B" stroke-width="1" stroke-opacity="0.6" transform="rotate(-2)"/>
    <rect x="-20" y="-28" width="60" height="46" rx="6" fill="#0A1628" stroke="#C8A84B" stroke-width="1" stroke-opacity="0.6" transform="rotate(6)"/>
  </g>

  <!-- Title -->
  <text x="400" y="462" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="700"
        fill="#FFF8C0" opacity="0.92"
        filter="url(#glow)">Rise of the Half Moon</text>

  <!-- Subtitle -->
  <text x="400" y="488" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        fill="#C8A84B" opacity="0.75">Thumbnail placeholder</text>
</svg>
